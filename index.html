<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jogos do Dia">
<title>Jogos do Dia</title>
<link rel="icon" id="favicon" type="image/png" href="icon-192.png?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<link rel="manifest" href="manifest.json">
<script src="comum/tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --text: #eef0f5;
    --muted: #8a90a0;
    --faint: #5b6070;
    --border: #262a34;
    --green: #5fbf6a;
    --green-soft: rgba(95, 191, 106, .14);
    --gold: #e0b84f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f7;
      --surface: #ffffff;
      --surface-2: #eef0f4;
      --text: #171a21;
      --muted: #676d7d;
      --faint: #a2a7b3;
      --border: #e3e5ea;
      --green: #3fa24c;
      --green-soft: rgba(63, 162, 76, .10);
      --gold: #b8871c;
      --shadow: 0 1px 2px rgba(20,24,33,.06), 0 6px 18px rgba(20,24,33,.06);
    }
  }
  :root[data-theme="light"] {
      --bg: #f3f4f7;
      --surface: #ffffff;
      --surface-2: #eef0f4;
      --text: #171a21;
      --muted: #676d7d;
      --faint: #a2a7b3;
      --border: #e3e5ea;
      --green: #3fa24c;
      --green-soft: rgba(63, 162, 76, .10);
      --gold: #b8871c;
      --shadow: 0 1px 2px rgba(20,24,33,.06), 0 6px 18px rgba(20,24,33,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* sem zoom por dois toques: o navegador trata cada toque como clique imediato */
  html, body, a, button { touch-action: manipulation; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; }
  body {
    margin: 0 auto;
    max-width: 560px;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--surface-2); }
  .ring .arc {
    stroke: var(--green); stroke-linecap: round;
    transition: stroke-dashoffset .5s cubic-bezier(.3,.7,.3,1);
  }
  .ring .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums;
  }
  .ring .num small { color: var(--muted); font-weight: 600; font-size: .75rem; }
  .head-text { min-width: 0; }
  h1 { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .date { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .date::first-letter { text-transform: uppercase; }
  .streak {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px; padding: 3px 9px;
    border-radius: 99px; font-size: .78rem; font-weight: 600;
    background: rgba(224,184,79,.14); color: var(--gold);
  }
  .streak[hidden] { display: none; }

  /* ---------- Grade de jogos (launchpad) ---------- */
  .grid {
    list-style: none; padding: 0; margin: 18px 0 0;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .app {
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    transition: background .25s, border-color .25s, transform .12s;
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .app:active { transform: scale(.96); }
  .app.done { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 45%, transparent); box-shadow: none; }

  a.game {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 6px 10px;
    color: inherit; text-decoration: none; text-align: center;
  }
  .icon {
    width: 64px; height: 64px; flex-shrink: 0;
    border-radius: 17px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(127,127,127,.12);
  }
  .icon img { width: 44px; height: 44px; object-fit: contain; border-radius: 9px; }
  .icon img.full { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
  .name {
    max-width: 100%;
    font-weight: 700; font-size: .92rem; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status {
    height: 1.1em; margin-top: -4px;
    font-size: .72rem; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .app.done .status { color: var(--green); }
  .tag {
    font-size: .58rem; font-weight: 700; letter-spacing: .05em;
    color: var(--muted); background: var(--surface-2);
    border-radius: 5px; padding: 1px 5px;
  }

  /* selo no canto: botão de marcar (externos) ou anel automático (nativos) */
  .badge {
    position: absolute; top: 7px; right: 7px;
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  button.badge {
    padding: 0; cursor: pointer; font: inherit;
    background: var(--surface); border: 2px solid var(--border);
    transition: background .2s, border-color .2s;
  }
  button.badge::before { content: ""; position: absolute; inset: -10px; }   /* área de toque maior */
  button.badge svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3.4; fill: none;
    stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s .05s; }
  button.badge[aria-checked="true"] { background: var(--green); border-color: var(--green); }
  button.badge[aria-checked="true"] svg { stroke-dashoffset: 0; }

  .mini-ring { width: 26px; height: 26px; transform: rotate(-90deg); }
  .mini-ring circle { fill: none; stroke-width: 3.5; }
  .mr-track { stroke: var(--border); }
  .mr-arc {
    stroke: var(--green); stroke-linecap: round;
    stroke-dasharray: 87.96; stroke-dashoffset: 87.96;
    transition: stroke-dashoffset .4s ease, fill .25s;
  }
  .mr-check {
    fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
    transform: rotate(90deg); transform-origin: 18px 18px;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s .15s;
  }
  .badge.finished .mr-arc { fill: var(--green); }
  .badge.finished .mr-check { stroke-dashoffset: 0; }

  /* ---------- Tudo feito ---------- */
  .all-done {
    display: none;
    margin-top: 18px; padding: 16px;
    text-align: center; border-radius: 16px;
    background: var(--green-soft); color: var(--green);
    font-weight: 700;
  }
  .all-done.show { display: block; animation: pop .35s ease; }

  /* seletor de tema geral (vale para o painel e os jogos nativos) */
  .theme-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: .82rem; font-weight: 600; }
  .theme-seg { display: inline-grid; grid-template-columns: repeat(3, auto); gap: 3px; padding: 3px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
  .theme-seg button {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border: none; border-radius: 99px; cursor: pointer;
    background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: .8rem;
  }
  .theme-seg svg { width: 15px; height: 15px; }
  .theme-seg button[aria-checked="true"] { background: var(--surface-2); color: var(--text); }
  footer { margin-top: 28px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  footer button {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    border-radius: 99px; padding: 9px 15px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  }

  /* ---------- Abas Hoje / Histórico ---------- */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    margin-top: 14px; padding: 4px;
    background: var(--surface-2); border-radius: 14px;
  }
  .tabs a {
    text-align: center; padding: 9px 0; border-radius: 10px;
    color: var(--muted); text-decoration: none; font-weight: 700; font-size: .9rem;
  }
  .tabs a[aria-current="page"] { background: var(--surface); color: var(--green); box-shadow: var(--shadow), inset 0 0 0 1.5px var(--green); }
  [hidden] { display: none !important; }

  /* ---------- Histórico ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 16px; box-shadow: var(--shadow);
  }
  .card + .card, .tiles + .card { margin-top: 12px; }
  .card h2 { margin: 0 0 2px; font-size: 1rem; font-weight: 800; letter-spacing: -.01em; }
  .card .sub { color: var(--muted); font-size: .8rem; margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .tile .v { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: .9rem; color: var(--muted); font-weight: 700; margin-left: 2px; }
  .tile .l { color: var(--muted); font-size: .78rem; font-weight: 600; margin-top: 2px; }

  /* calendário */
  .cal { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
  .cal-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font-size: .62rem; color: var(--faint); font-weight: 600; }
  .cal-days span { display: flex; align-items: center; }
  .cal-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .cell {
    aspect-ratio: 1; border-radius: 4px; border: none; padding: 0; cursor: pointer;
    background: var(--surface-2);
  }
  .cell.l1 { background: color-mix(in srgb, var(--green) 28%, var(--surface-2)); }
  .cell.l2 { background: color-mix(in srgb, var(--green) 52%, var(--surface-2)); }
  .cell.l3 { background: color-mix(in srgb, var(--green) 76%, var(--surface-2)); }
  .cell.l4 { background: var(--green); }
  .cell.before, .cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--border); cursor: default; }
  .cell.future { visibility: hidden; }
  .cell.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .cal-months { display: grid; grid-auto-flow: column; font-size: .62rem; color: var(--faint); font-weight: 600; margin: 0 0 4px 24px; }
  .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 10px; font-size: .68rem; color: var(--muted); }
  .legend .cell { width: 11px; cursor: default; }
  .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: .85rem; min-height: 1.2em; }
  .detail b { font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .chip.on { background: var(--green-soft); color: var(--green); }

  /* barras verticais */
  .vbars { position: relative; height: 120px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--border); }
  .vbars .guide { position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed var(--border); pointer-events: none; }
  .vbars .guide span { position: absolute; right: 0; top: -15px; font-size: .62rem; color: var(--faint); font-weight: 600; }
  .vbar { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; background: none; border: none; padding: 0; }
  .vbar i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--green) 55%, var(--surface-2)); min-height: 0; }
  .vbar.full i { background: var(--green); }
  .vbar.lost i { background: var(--faint); }
  .vbar.none i { height: 3px !important; background: var(--surface-2); border-radius: 2px; }
  .vbar.sel i { outline: 2px solid var(--text); outline-offset: 1px; }
  .axis { display: flex; justify-content: space-between; font-size: .62rem; color: var(--faint); font-weight: 600; margin-top: 5px; }
  .readout { font-size: .8rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .readout b { color: var(--text); }

  /* barras horizontais */
  .hrow { display: grid; grid-template-columns: 24px 88px 1fr 44px; align-items: center; gap: 8px; margin: 7px 0; font-size: .85rem; }
  .hrow img, .hrow .em { width: 20px; height: 20px; border-radius: 5px; object-fit: contain; font-size: 1rem; line-height: 20px; text-align: center; }
  .hrow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .hrow .track i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
  .hrow .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .78rem; font-weight: 600; }

  /* jogos nativos */
  .game-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .game-head img { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; background: var(--surface-2); }
  .minis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; text-align: center; }
  .minis .v { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .minis .l { font-size: .66rem; color: var(--muted); font-weight: 600; }
  .mini-title { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
  .dist .hrow { grid-template-columns: 14px 1fr 30px; margin: 4px 0; }
  .dist .n { color: var(--muted); font-weight: 700; font-size: .78rem; }
  .empty { color: var(--muted); font-size: .82rem; padding: 6px 0; }
</style>
</head>
<body>

<header>
  <div class="ring">
    <svg viewBox="0 0 80 80">
      <circle class="track" cx="40" cy="40" r="34"/>
      <circle class="arc" id="arc" cx="40" cy="40" r="34"/>
    </svg>
    <div class="num" id="count"></div>
  </div>
  <div class="head-text">
    <h1>Jogos do Dia</h1>
    <div class="date" id="date"></div>
    <div class="streak" id="streak" hidden></div>
  </div>
</header>

<nav class="tabs" aria-label="Seções">
  <a href="#" id="tabToday" aria-current="page">Hoje</a>
  <a href="#historico" id="tabHistory">Histórico</a>
</nav>

<section id="viewHistory" hidden>
  <div class="tiles" id="hTiles"></div>

  <div class="card">
    <h2>Últimas 12 semanas</h2>
    <div class="sub">Quanto mais verde, mais jogos feitos no dia. Toque num dia para ver.</div>
    <div class="cal-months" id="calMonths"></div>
    <div class="cal">
      <div class="cal-days"><span>S</span><span></span><span>Q</span><span></span><span>S</span><span></span><span>D</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="legend">menos <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> tudo</div>
    <div class="detail" id="calDetail"></div>
  </div>

  <div class="card">
    <h2>Jogos por dia</h2>
    <div class="sub">Últimos 30 dias · verde forte = dia completo</div>
    <div class="vbars" id="dayBars"></div>
    <div class="axis" id="dayAxis"></div>
    <div class="readout" id="dayReadout"></div>
  </div>

  <div class="card">
    <h2>Por jogo</h2>
    <div class="sub" id="perGameSub"></div>
    <div id="perGame"></div>
  </div>

  <div id="nativeCards"></div>
</section>

<div id="viewToday">
<ul class="grid" id="grid"></ul>
<div class="all-done" id="allDone">🎉 Tudo feito por hoje!</div>
</div>

<footer id="footerToday">
  <button id="badgeBtn" hidden>🔔 Mostrar pendentes no ícone</button>
  <button id="toggleTab"></button>
  <button id="reset">Desmarcar tudo</button>
</footer>

<div class="theme-row">
  <span>Tema</span>
  <div class="theme-seg" role="radiogroup" aria-label="Tema">
    <button data-t="auto" role="radio"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>Auto</button>
    <button data-t="light" role="radio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Claro</button>
    <button data-t="dark" role="radio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>Escuro</button>
  </div>
</div>

<script>
/* ============================================================
   LISTA DE JOGOS — para adicionar um jogo, copie uma linha.
   url:   endereço completo, ou o nome da pasta para jogos dentro deste repositório (ex.: "sanduba/")
   id:    identificador único (não mude depois, é usado no progresso)
   emoji: usado enquanto o ícone carrega ou se o site não tiver ícone
   icon:  (opcional) URL de um ícone específico, ignora a busca automática
   app:   (opcional) true = link que abre o app do celular
   iconFull: (opcional) true = o ícone ocupa o quadrado inteiro (para ícones com fundo próprio)
   ============================================================ */
const GAMES = [
  { id: "termo",      name: "Termo",      emoji: "🟩", desc: "Wordle em português",           url: "https://term.ooo/" },
  { id: "spotle",     name: "Spotle",     emoji: "🎵", desc: "Adivinhe o artista",            url: "https://spotle.io/" },
  { id: "betweenle",  name: "Betweenle",  emoji: "↕️", desc: "A palavra está entre…",         url: "https://betweenle.com/" },
  { id: "sanduba",    name: "Sanduba",    emoji: "🥪", desc: "Betweenle em português",        url: "sanduba/", icon: "sanduba/icon.png" },
  { id: "word500",    name: "Word500",    emoji: "🔢", desc: "Dedução por contagem",          url: "https://word500.com/" },
  { id: "quinhentos", name: "Quinhentos", emoji: "5️⃣", desc: "Word500 em português",          url: "quinhentos/", icon: "quinhentos/icon.png", iconFull: true },
  { id: "foximax",    name: "Foximax",    emoji: "🦊", desc: "foximax.com",                   url: "https://foximax.com/" },
  { id: "linkedin",   name: "LinkedIn",   emoji: "💼", desc: "Queens, Tango, Zip, Pinpoint…", url: "https://www.linkedin.com/games/", app: true },
  { id: "eclipse",    name: "Eclipse",    emoji: "🌗", desc: "Um sol e uma lua em cada linha", url: "eclipse/", icon: "eclipse/icon.png", iconFull: true },
];

/* ============================================================ */

/* ---------- Progresso dos jogos deste repositório ----------
   Sanduba e Quinhentos rodam no mesmo endereço do painel, então o painel
   consegue ler a partida do dia que eles salvam no navegador.
   Cada função devolve null (não começou) ou { tries, max, finished, won }. */
function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }

const LOCAL_PROGRESS = {
  sanduba() {
    const d = new Date();                    // o Sanduba usa a data sem zeros: 2026-9-27
    const p = readJSON(`sanduba-daily-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`);
    if (!p || !Array.isArray(p.guesses) || !p.guesses.length) return null;
    const max = 14, tries = p.guesses.length;
    const won = p.guesses.some(g => g.word === p.secret);
    return { tries, max, won, finished: won || tries >= max };
  },
  quinhentos() {
    const p = readJSON("quinhentao:game:padrao");
    // mesmo cálculo do jogo: dias desde 1º/jan/2024, contando a partir de 1
    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const dayNum = Math.floor((today0 - new Date(2024, 0, 1)) / 86400000) + 1;
    if (!p || p.dayNum !== dayNum || !Array.isArray(p.guesses) || !p.guesses.length) return null;
    return { tries: p.guesses.length, max: 8, won: !!p.won, finished: !!p.finished };
  },
  eclipse() {
    // desafio #1 = 27/09/2026 (mesma conta do jogo)
    const today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const dayNum = Math.round((today0 - new Date(2026, 8, 27)) / 86400000) + 1;
    const p = readJSON(`eclipse:dia:${dayNum}`);
    if (!p || typeof p.cells !== "string") return null;
    const placed = (p.cells.match(/[SM]/g) || []).length;
    if (!p.done && !p.started) return null;             // aberto, mas nenhuma jogada ainda
    return { tries: placed, max: 18, won: !!p.done, finished: !!p.done, time: p.done ? p.time : null };
  },
};

const fmtTime = s => { s = Math.round(s || 0); const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };

function progressOf(g) {
  const fn = LOCAL_PROGRESS[g.id];
  if (!fn) return null;
  try { return fn(); } catch { return null; }
}

/* ---------- Ícones ----------
   Tenta, em ordem: ícone definido → favicon do próprio caminho do site
   → serviço de favicons do Google. Se nada servir, fica o emoji. */
function iconCandidates(g) {
  if (g.icon) return [g.icon];
  const u = new URL(g.url, location.href);   // aceita endereços relativos (jogos dentro deste repositório)
  const base = u.origin + u.pathname.replace(/[^/]*$/, "");
  const list = [];
  // sites em github.io compartilham domínio: procura o ícone dentro da pasta do jogo
  if (u.origin === location.origin || u.hostname.endsWith("github.io")) {
    list.push(base + "favicon.svg", base + "favicon.png", base + "favicon.ico", base + "apple-touch-icon.png");
  } else {
    list.push(`https://www.google.com/s2/favicons?domain=${u.hostname}&sz=128`);
    list.push(u.origin + "/apple-touch-icon.png", u.origin + "/favicon.ico");
  }
  return list;
}

function loadIcon(g, box) {
  const tries = iconCandidates(g);
  const next = () => {
    const src = tries.shift();
    if (!src) return;                         // desiste: mantém o emoji
    const img = new Image();
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.onload = () => {
      // o serviço do Google devolve um globo genérico de 16px quando não acha o ícone
      if (src.includes("google.com/s2") && img.naturalWidth <= 16) return next();
      if (g.iconFull) img.className = "full";      // ícone ocupa o quadrado inteiro
      box.textContent = "";
      box.appendChild(img);
    };
    img.onerror = next;
    img.src = src;
  };
  next();
}

/* ---------- Estado ---------- */
const KEY = "jogosDoDia.v1";
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => dayKey(new Date());

function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { s = {}; }
  s.history ??= {};
  s.newTab ??= false;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

const state = load();
// guarda até 2 anos (são poucos bytes por dia)
state.results ??= {};   // resultado dos jogos nativos por dia: { "2026-09-27": { sanduba: {tries, max, won} } }
Object.keys(state.history).sort().slice(0, -730).forEach(d => delete state.history[d]);
Object.keys(state.results).sort().slice(0, -730).forEach(d => delete state.results[d]);

// recupera partidas antigas do Sanduba, que ele guarda por data
function backfillSanduba() {
  let changed = false;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    const m = k && k.match(/^sanduba-daily-(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) continue;
    const day = `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    if (day === today() || state.results[day]?.sanduba) continue;
    const p = readJSON(k);
    if (!p || !Array.isArray(p.guesses) || !p.guesses.length) continue;
    const tries = p.guesses.length, won = p.guesses.some(g => g.word === p.secret);
    if (!won && tries < 14) continue;          // partida largada no meio: não conta
    (state.results[day] ??= {}).sanduba = { tries, max: 14, won };
    const set = new Set(state.history[day] || []); set.add("sanduba"); state.history[day] = [...set];
    changed = true;
  }
  if (changed) save();
}
backfillSanduba();
delete state.auto;   // campo de uma versão anterior

// jogos nativos: feito = partida do dia terminada (o painel só espelha o que o jogo salvou)
function syncLocalGames() {
  const set = doneToday();
  let changed = false;
  for (const g of GAMES) {
    if (!LOCAL_PROGRESS[g.id]) continue;
    const p = progressOf(g), finished = !!p?.finished;
    if (!finished && state.results[today()]?.[g.id]) { delete state.results[today()][g.id]; changed = true; }
    if (finished) {
      const r = (state.results[today()] ??= {});
      if (r[g.id]?.tries !== p.tries || r[g.id]?.time !== p.time) {
        r[g.id] = { tries: p.tries, max: p.max, won: p.won };
        if (p.time != null) r[g.id].time = p.time;
        changed = true;
      }
    }
    if (finished !== set.has(g.id)) {
      finished ? set.add(g.id) : set.delete(g.id);
      changed = true;
    }
  }
  if (changed) { state.history[today()] = [...set]; save(); }
}

const doneToday = () => new Set(state.history[today()] || []);
function setDone(id, value) {
  const set = doneToday();
  value ? set.add(id) : set.delete(id);
  state.history[today()] = [...set];
  save();
  render();
}

function streak() {
  const full = k => GAMES.every(g => (state.history[k] || []).includes(g.id));
  const d = new Date();
  if (!full(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (full(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- Cartões (criados uma vez, só mudam de lista) ---------- */
const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const cards = {};

function buildCard(g) {
  const li = document.createElement("li");
  li.className = "app";
  li.innerHTML = `
    <a class="game" href="${g.url}" title="${g.desc || ""}">
      <span class="icon">${g.emoji}</span>
      <span class="name">${g.name}</span>
      <span class="status"></span>
    </a>`;
  loadIcon(g, li.querySelector(".icon"));
  if (LOCAL_PROGRESS[g.id]) {
    // jogos nativos: anel automático, sem controle manual
    li.insertAdjacentHTML("beforeend", `
      <span class="badge auto" role="img">
        <svg class="mini-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="mr-track" cx="18" cy="18" r="14"/>
          <circle class="mr-arc" cx="18" cy="18" r="14"/>
          <path class="mr-check" d="M11.5 18.5l4.5 4.5 8.5-9"/>
        </svg>
      </span>`);
    return li;
  }
  // jogos externos: abrir já marca como feito; o selo marca/desmarca à mão
  li.insertAdjacentHTML("beforeend",
    `<button class="badge" role="switch" aria-checked="false" aria-label="${g.name} feito">${CHECK_SVG}</button>`);
  li.querySelector("a").addEventListener("click", () => setDone(g.id, true));
  li.querySelector("button.badge").addEventListener("click", e => {
    setDone(g.id, e.currentTarget.getAttribute("aria-checked") !== "true");
  });
  return li;
}
GAMES.forEach(g => cards[g.id] = buildCard(g));

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 34;
const MINI_CIRC = 2 * Math.PI * 14;
$("arc").style.strokeDasharray = CIRC;

function statusText(g, p, isDone) {
  if (p) {
    if (!p.finished) return `${p.tries}/${p.max}`;
    if (p.time != null) return `⏱ ${fmtTime(p.time)}`;
    return p.won ? `Acertou ${p.tries}/${p.max}` : "Não foi";
  }
  if (isDone) return "Feito";
  return g.app ? '<span class="tag">APP</span>' : "";
}

function render() {
  syncLocalGames();
  const done = doneToday();
  const grid = $("grid");

  for (const g of GAMES) {
    const li = cards[g.id];
    if (li.parentNode !== grid) grid.appendChild(li);   // ordem fixa: a da lista GAMES
    const isDone = done.has(g.id);
    const p = LOCAL_PROGRESS[g.id] ? progressOf(g) : null;
    li.classList.toggle("done", isDone);
    li.querySelector(".status").innerHTML = statusText(g, p, isDone);

    const auto = li.querySelector(".badge.auto");
    if (auto) {
      const frac = p ? (p.finished ? 1 : p.tries / p.max) : 0;
      auto.classList.toggle("finished", !!p?.finished);
      auto.querySelector(".mr-arc").style.strokeDashoffset = MINI_CIRC * (1 - frac);
      auto.setAttribute("aria-label", `${g.name}: ${!p ? "não começou" : p.finished ? "feito" : `${p.tries} de ${p.max} ${"time" in p ? "peças" : "tentativas"}`}`);
    }
    const btn = li.querySelector("button.badge");
    if (btn) btn.setAttribute("aria-checked", isDone);

    const a = li.querySelector("a");
    if (state.newTab && !g.app) { a.target = "_blank"; a.rel = "noopener"; }
    else { a.removeAttribute("target"); a.removeAttribute("rel"); }
  }

  const n = GAMES.filter(g => done.has(g.id)).length, total = GAMES.length;
  $("count").innerHTML = `${n}<small>/${total}</small>`;
  $("arc").style.strokeDashoffset = CIRC * (1 - n / total);

  $("allDone").classList.toggle("show", n === total);

  const s = streak();
  $("streak").hidden = s === 0;
  $("streak").textContent = `🔥 ${s} dia${s > 1 ? "s" : ""} seguido${s > 1 ? "s" : ""} completo${s > 1 ? "s" : ""}`;

  $("toggleTab").textContent = state.newTab ? "↗ Abrindo em nova aba" : "↩ Abrindo na mesma aba";

  if (location.hash === "#historico" && typeof renderHistory === "function") renderHistory();
  updateBadge(total - n);
}

/* ---------- Número no ícone do app (Badging API) ----------
   Funciona no app instalado no iPhone (iOS 16.4+, com notificações permitidas)
   e em computadores. O Chrome do Android não mostra esse número. */
const canBadge = "setAppBadge" in navigator;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

function updateBadge(pending) {
  if (!canBadge) return;
  const p = pending > 0 ? navigator.setAppBadge(pending) : navigator.clearAppBadge();
  p?.catch?.(() => {});
}

// no iPhone o número só aparece depois de permitir notificações uma vez
if (canBadge && isStandalone && "Notification" in window && Notification.permission === "default") {
  $("badgeBtn").hidden = false;
  $("badgeBtn").addEventListener("click", async () => {
    try { await Notification.requestPermission(); } catch {}
    $("badgeBtn").hidden = true;
    render();
  });
}

/* ---------- Virada do dia com o app aberto ---------- */
function scheduleMidnight() {
  const now = new Date(), next = new Date(now);
  next.setHours(24, 0, 5, 0);
  setTimeout(() => { renderDate(); render(); scheduleMidnight(); }, next - now);
}

/* ---------- Instalável / offline ---------- */
if ("serviceWorker" in navigator) {
  // atualização automática: o app da tela inicial não tem botão de recarregar,
  // então o painel procura versão nova sempre que volta para a tela e se recarrega sozinho.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;   // primeira instalação: não precisa recarregar
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}

function renderDate() {
  $("date").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
}

// tema geral: Automático segue o celular; Claro/Escuro forçam (painel e jogos nativos)
function renderTheme() {

document.querySelectorAll(".theme-seg button").forEach(b => b.addEventListener("click", () => { jogosTema.set(b.dataset.t); renderTheme(); }));
renderTheme();

$("toggleTab").addEventListener("click", () => { state.newTab = !state.newTab; save(); render(); });
$("reset").addEventListener("click", () => {

});

document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderDate(); render(); } });
window.addEventListener("pageshow", () => { renderDate(); render(); });
// se um jogo estiver aberto em outra aba e terminar, o painel atualiza sozinho

/* ================= HISTÓRICO ================= */
const WEEK = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtDay = d => `${WEEK[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const countOn = k => (state.history[k] || []).filter(id => GAMES.some(g => g.id === id)).length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function firstDay() {
  const ks = Object.keys(state.history).filter(k => (state.history[k] || []).length).sort();
  return ks.length ? new Date(ks[0] + "T00:00:00") : startOfToday();
}
function iconHTML(g) {
  const img = cards[g.id]?.querySelector(".icon img");
  return img ? `<img src="${esc(img.src)}" alt="">` : `<span class="em">${g.emoji}</span>`;
}
function bestStreak() {
  const ks = Object.keys(state.history).sort();
  if (!ks.length) return 0;
  let best = 0, run = 0;
  for (let d = new Date(ks[0] + "T00:00:00"); d <= startOfToday(); d = addDays(d, 1)) {
    run = countOn(dayKey(d)) >= GAMES.length ? run + 1 : 0;
    best = Math.max(best, run);
  }
  return best;
}

function renderHistory() {
  const total = GAMES.length, t0 = startOfToday(), first = firstDay();
  // janela de 30 dias (ou desde o primeiro uso, se for mais recente)
  const winStart = new Date(Math.max(addDays(t0, -29), first));
  const winDays = Math.round((t0 - winStart) / 86400000) + 1;
  let winDone = 0, fullDays = 0;
  for (let i = 0; i < winDays; i++) winDone += countOn(dayKey(addDays(winStart, i)));
  for (const k of Object.keys(state.history)) if (countOn(k) >= total) fullDays++;

  $("hTiles").innerHTML = [
    [streak(), "dias", "Sequência atual"],
    [bestStreak(), "dias", "Melhor sequência"],
    [fullDays, "", "Dias com tudo feito"],
    [Math.round(100 * winDone / (winDays * total)), "%", `Aproveitamento · ${winDays} dia${winDays > 1 ? "s" : ""}`],
  ].map(([v, u, l]) => `<div class="tile"><div class="v">${v}<small>${u}</small></div><div class="l">${l}</div></div>`).join("");

  renderCalendar(t0, first, total);
  renderDayBars(t0, first, total);

  // por jogo
  $("perGameSub").textContent = `Dias em que você fez cada jogo · ${winDays === 30 ? "últimos 30 dias" : `desde ${fmtDay(winStart)}`}`;
  $("perGame").innerHTML = GAMES.map(g => {
    let n = 0;
    for (let i = 0; i < winDays; i++) if ((state.history[dayKey(addDays(winStart, i))] || []).includes(g.id)) n++;
    return `<div class="hrow">${iconHTML(g)}<span class="nm">${esc(g.name)}</span>
      <span class="track"><i style="width:${100 * n / winDays}%"></i></span><span class="val">${n}/${winDays}</span></div>`;
  }).join("");

  renderNative(t0);
}

let calSel = null;
function renderCalendar(t0, first, total) {
  // 12 colunas (semanas), começando na segunda-feira
  const mondayThisWeek = addDays(t0, -((t0.getDay() + 6) % 7));
  const start = addDays(mondayThisWeek, -7 * 11);
  const grid = $("calGrid"); grid.innerHTML = "";
  const months = [];
  for (let w = 0; w < 12; w++) {
    const wk = addDays(start, 7 * w);
    months.push(wk.getDate() <= 7 || w === 0 ? MONTHS[wk.getMonth()] : "");
    for (let d = 0; d < 7; d++) {
      const day = addDays(wk, d), k = dayKey(day), n = countOn(k);
      const b = document.createElement("button");
      b.className = "cell";
      if (day > t0) b.classList.add("future");
      else if (day < first) b.classList.add("before");
      else if (n) b.classList.add("l" + Math.max(1, Math.min(4, Math.ceil(4 * n / total))));
      b.dataset.day = k;
      b.setAttribute("aria-label", `${fmtDay(day)}: ${n} de ${total}`);
      if (day <= t0 && day >= first) b.addEventListener("click", () => { calSel = k; showDay(k, total); });
      grid.appendChild(b);
    }
  }
  $("calMonths").style.gridTemplateColumns = "repeat(12, 1fr)";
  $("calMonths").innerHTML = months.map(m => `<span>${m}</span>`).join("");
  showDay(calSel || dayKey(t0), total);
}
function showDay(k, total) {
  document.querySelectorAll("#calGrid .cell.sel").forEach(c => c.classList.remove("sel"));
  document.querySelector(`#calGrid .cell[data-day="${k}"]`)?.classList.add("sel");
  const d = new Date(k + "T00:00:00"), ids = state.history[k] || [], n = countOn(k), res = state.results[k] || {};
  $("calDetail").innerHTML = `<b>${fmtDay(d)}</b> · ${n} de ${total} jogo${total > 1 ? "s" : ""}${n >= total ? " 🎉" : ""}
    <div class="chips">${GAMES.map(g => {
      const r = res[g.id], extra = !r ? "" : r.time != null ? ` ${fmtTime(r.time)}` : r.won ? ` ${r.tries}/${r.max}` : " ✗";
      return `<span class="chip${ids.includes(g.id) ? " on" : ""}">${esc(g.name)}${extra}</span>`;
    }).join("")}</div>`;
}

function renderDayBars(t0, first, total) {
  const box = $("dayBars"); box.innerHTML = `<div class="guide"><span>${total}</span></div>`;
  const days = [...Array(30)].map((_, i) => addDays(t0, i - 29));
  const read = (d, n) => { $("dayReadout").innerHTML = `<b>${fmtDay(d)}</b> · ${d < first ? "antes do primeiro uso" : `${n} de ${total} jogos`}`; };
  days.forEach(d => {
    const n = countOn(dayKey(d)), b = document.createElement("button");
    b.className = "vbar" + (n >= total ? " full" : "") + (n === 0 ? " none" : "");
    b.innerHTML = `<i style="height:${100 * n / total}%"></i>`;
    b.setAttribute("aria-label", `${fmtDay(d)}: ${n} de ${total}`);
    b.addEventListener("click", () => { box.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); read(d, n); });
    box.appendChild(b);
  });
  $("dayAxis").innerHTML = `<span>${days[0].getDate()} ${MONTHS[days[0].getMonth()]}</span><span>${days[15].getDate()} ${MONTHS[days[15].getMonth()]}</span><span>hoje</span>`;
  read(t0, countOn(dayKey(t0)));
}

function renderNative(t0) {
  const blocks = [];
  const specs = [
    { id: "sanduba", stats: () => { const s = readJSON("sanduba-stats") || {}; return { played: s.played || 0, wins: s.wins || 0, streak: s.streak || 0, best: s.best || 0 }; } },
    { id: "quinhentos", stats: () => { const s = readJSON("quinhentao:stats:padrao") || {}; return { played: s.played || 0, wins: s.wins || 0, streak: s.streak || 0, best: s.maxStreak || 0, dist: s.dist }; } },
  ];
  for (const sp of specs) {
    const g = GAMES.find(x => x.id === sp.id);
    if (!g) continue;
    const s = sp.stats();
    const pct = s.played ? Math.round(100 * s.wins / s.played) : 0;
    // tentativas por dia (últimos 30)
    const days = [...Array(30)].map((_, i) => addDays(t0, i - 29));
    const rs = days.map(d => state.results[dayKey(d)]?.[g.id]);
    const withData = rs.filter(Boolean);
    const avg = withData.filter(r => r.won).map(r => r.tries);
    const max = withData[0]?.max || (g.id === "sanduba" ? 14 : 8);
    const bars = days.map((d, i) => {
      const r = rs[i];
      const cls = !r ? "none" : r.won ? "full" : "lost";
      const h = !r ? 0 : r.won ? 100 * r.tries / max : 100;
      const lab = !r ? "sem partida" : r.won ? `acertou em ${r.tries}/${r.max}` : "não acertou";
      return `<button class="vbar ${cls}" data-lab="${esc(fmtDay(d) + " · " + lab)}" aria-label="${esc(fmtDay(d) + ": " + lab)}"><i style="height:${h}%"></i></button>`;
    }).join("");
    let dist = "";
    if (Array.isArray(s.dist) && s.dist.some(Boolean)) {
      const top = Math.max(...s.dist);
      dist = `<div class="mini-title">Acertou em quantas tentativas</div><div class="dist">${s.dist.map((v, i) =>
        `<div class="hrow"><span class="n">${i + 1}</span><span class="track"><i style="width:${top ? 100 * v / top : 0}%"></i></span><span class="val">${v}</span></div>`).join("")}</div>`;
    }
    blocks.push(`<div class="card">
      <div class="game-head">${iconHTML(g).replace('class="em"', 'class="em" style="font-size:1.6rem"')}<div><h2>${esc(g.name)}</h2><div class="sub" style="margin:0">Estatísticas do próprio jogo</div></div></div>
      <div class="minis">
        <div><div class="v">${s.played}</div><div class="l">jogadas</div></div>
        <div><div class="v">${pct}%</div><div class="l">vitórias</div></div>
        <div><div class="v">${s.streak}</div><div class="l">sequência</div></div>
        <div><div class="v">${s.best}</div><div class="l">melhor</div></div>
      </div>
      <div class="mini-title">Tentativas por dia · 30 dias${avg.length ? ` · média ${(avg.reduce((a, b) => a + b, 0) / avg.length).toFixed(1).replace(".", ",")}` : ""}</div>
      ${withData.length ? `<div class="vbars" style="height:80px">${bars}</div>
        <div class="axis"><span>${days[0].getDate()} ${MONTHS[days[0].getMonth()]}</span><span>hoje</span></div>
        <div class="readout">Barra mais baixa = menos tentativas. Cinza = não acertou.</div>`
        : `<div class="empty">Os resultados começam a aparecer aqui a partir das próximas partidas.</div>`}
      ${dist}
    </div>`);
  }
  // Eclipse: o desempenho é o tempo
  const ge = GAMES.find(x => x.id === "eclipse");
  if (ge) {
    const st = readJSON("eclipse:stats") || {};
    const times = st.times || {};                            // { número do dia: segundos }
    const e0 = new Date(2026, 8, 27);
    const dnum = d => Math.round((d - e0) / 86400000) + 1;
    const days = [...Array(30)].map((_, i) => addDays(t0, i - 29));
    const vals = days.map(d => times[dnum(d)] ?? state.results[dayKey(d)]?.eclipse?.time ?? null);
    const all = Object.values(times);
    const best = all.length ? Math.min(...all) : null;
    const avg = all.length ? all.reduce((a, b) => a + b, 0) / all.length : null;
    const top = Math.max(1, ...vals.filter(v => v != null));
    const bars = days.map((d, i) => {
      const v = vals[i];
      const lab = v == null ? "sem partida" : `resolvido em ${fmtTime(v)}`;
      return `<button class="vbar ${v == null ? "none" : "full"}" data-lab="${esc(fmtDay(d) + " · " + lab)}" aria-label="${esc(fmtDay(d) + ": " + lab)}"><i style="height:${v == null ? 0 : Math.max(6, 100 * v / top)}%"></i></button>`;
    }).join("");
    blocks.push(`<div class="card">
      <div class="game-head">${iconHTML(ge)}<div><h2>Eclipse</h2><div class="sub" style="margin:0">Tempo para resolver</div></div></div>
      <div class="minis">
        <div><div class="v">${st.played || 0}</div><div class="l">resolvidos</div></div>
        <div><div class="v">${st.streak || 0}</div><div class="l">sequência</div></div>
        <div><div class="v">${best == null ? "–" : fmtTime(best)}</div><div class="l">melhor</div></div>
        <div><div class="v">${avg == null ? "–" : fmtTime(avg)}</div><div class="l">média</div></div>
      </div>
      <div class="mini-title">Tempo por dia · 30 dias</div>
      ${vals.some(v => v != null) ? `<div class="vbars" style="height:80px">${bars}</div>
        <div class="axis"><span>${days[0].getDate()} ${MONTHS[days[0].getMonth()]}</span><span>hoje</span></div>
        <div class="readout">Barra mais baixa = mais rápido. Toque numa barra para ver o tempo.</div>`
        : `<div class="empty">Seus tempos aparecem aqui depois do primeiro desafio resolvido.</div>`}
    </div>`);
  }
  $("nativeCards").innerHTML = blocks.join("");
  $("nativeCards").querySelectorAll(".vbar").forEach(b => b.addEventListener("click", () => {
    const card = b.closest(".card");
    card.querySelectorAll(".vbar.sel").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    card.querySelector(".readout").innerHTML = esc(b.dataset.lab);
  }));
}

/* ---------- Abas ---------- */
function route() {
  const hist = location.hash === "#historico";
  $("viewHistory").hidden = !hist;
  $("viewToday").hidden = hist;
  $("footerToday").hidden = hist;
  $("tabToday").setAttribute("aria-current", hist ? "false" : "page");
  $("tabHistory").setAttribute("aria-current", hist ? "page" : "false");
  if (hist) renderHistory();
}
$("tabToday").addEventListener("click", e => { e.preventDefault(); history.replaceState(null, "", location.pathname); route(); });
$("tabHistory").addEventListener("click", e => { e.preventDefault(); history.replaceState(null, "", "#historico"); route(); });
window.addEventListener("hashchange", route);

renderDate();
render();
route();
scheduleMidnight();
</script>
</body>
