<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jogos do Dia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
  :root {
    --bg: #14161c;
    --card: #1e2129;
    --card-done: #182a20;
    --text: #eef0f4;
    --muted: #8b90a0;
    --accent: #6aaa64;
    --accent2: #c9b458;
    --border: #2c303b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --card-done: #e7f4e5;
      --text: #1a1c22;
      --muted: #6b7080;
      --border: #dfe1e6;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin-inline: auto;
  }
  header { margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .date { color: var(--muted); font-size: .9rem; text-transform: capitalize; }

  .progress {
    display: flex; align-items: center; gap: 10px;
    margin: 14px 0 6px;
  }
  .bar { flex: 1; height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .count { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .streak { color: var(--muted); font-size: .85rem; }
  .streak b { color: var(--accent2); }

  ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
  li {
    display: flex; align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: background .2s, opacity .2s;
  }
  li.done { background: var(--card-done); }
  li.done .name { opacity: .6; text-decoration: line-through; }
  a.game {
    flex: 1; display: flex; align-items: center; gap: 12px;
    padding: 14px; color: inherit; text-decoration: none; min-width: 0;
  }
  .emoji { font-size: 1.7rem; width: 2rem; text-align: center; flex-shrink: 0; }
  .info { min-width: 0; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .desc { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.check {
    width: 56px; align-self: stretch; flex-shrink: 0;
    background: none; border: none; border-left: 1px solid var(--border);
    color: var(--muted); font-size: 1.4rem; cursor: pointer;
  }
  button.check .circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--muted); font-size: 1rem;
  }
  button.check .undo { display: block; font-size: .62rem; margin-top: 3px; }
  li.done button.check { color: var(--accent); }
  li.done button.check .circle { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tag {
    font-size: .65rem; font-weight: 600; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 1px 5px; margin-left: 6px;
    vertical-align: middle;
  }

  .all-done {
    display: none; text-align: center; margin-top: 20px;
    font-size: 1.1rem; font-weight: 600; color: var(--accent);
  }
  .all-done.show { display: block; }

  footer { margin-top: 28px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  footer button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 99px; padding: 8px 14px; font-size: .85rem; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🧩 Jogos do Dia</h1>
  <div class="date" id="date"></div>
  <div class="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </div>
  <div class="streak" id="streak"></div>
</header>

<ul id="list"></ul>
<div class="all-done" id="allDone">🎉 Tudo feito por hoje!</div>

<footer>
  <button id="toggleTab"></button>
  <button id="reset">Desmarcar tudo</button>
</footer>

<script>
/* ============================================================
   LISTA DE JOGOS — para adicionar um jogo, copie uma linha.
   id: identificador único (não mude depois, é usado no progresso)
   ============================================================ */
const GAMES = [
  { id: "termo",      name: "Termo",      emoji: "🟩", desc: "Wordle em português",          url: "https://term.ooo/" },
  { id: "spotle",     name: "Spotle",     emoji: "🎵", desc: "Adivinhe o artista",           url: "https://spotle.io/" },
  { id: "betweenle",  name: "Betweenle",  emoji: "↕️", desc: "A palavra está entre…",        url: "https://betweenle.com/" },
  { id: "sanduba",    name: "Sanduba",    emoji: "🥪", desc: "Betweenle em português",       url: "https://a-hanauer.github.io/sanduba-jogo/" },
  { id: "word500",    name: "Word500",    emoji: "🔢", desc: "Dedução por contagem",         url: "https://word500.com/" },
  { id: "quinhentos", name: "Quinhentos", emoji: "5️⃣", desc: "Word500 em português",         url: "https://a-hanauer.github.io/500/" },
  { id: "foximax",    name: "Foximax",    emoji: "🦊", desc: "foximax.com",                  url: "https://foximax.com/" },
  { id: "linkedin",   name: "LinkedIn",   emoji: "💼", desc: "Queens, Tango, Zip, Pinpoint…", url: "https://www.linkedin.com/games/", app: true },
];

/* ============================================================ */
const KEY = "jogosDoDia.v1";
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};

function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { s = {}; }
  s.history ??= {};        // { "2026-09-26": ["termo", ...] }
  s.newTab ??= false;
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

let state = load();
// guarda só os últimos 60 dias
const days = Object.keys(state.history).sort();
days.slice(0, Math.max(0, days.length - 60)).forEach(d => delete state.history[d]);

const doneToday = () => new Set(state.history[today()] || []);
function setDone(id, value) {
  const set = doneToday();
  value ? set.add(id) : set.delete(id);
  state.history[today()] = [...set];
  save();
  render();
}

function streak() {
  // dias seguidos com todos os jogos feitos (hoje conta se já completou)
  const total = GAMES.length;
  let n = 0;
  const d = new Date();
  const key = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const full = k => (state.history[k] || []).filter(id => GAMES.some(g => g.id === id)).length >= total;
  if (!full(key(d))) d.setDate(d.getDate() - 1);
  while (full(key(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function render() {
  const done = doneToday();
  const list = document.getElementById("list");
  list.innerHTML = "";

  // pendentes primeiro, feitos no fim
  const ordered = [...GAMES].sort((a, b) => done.has(a.id) - done.has(b.id));
  for (const g of ordered) {
    const li = document.createElement("li");
    if (done.has(g.id)) li.className = "done";
    const isDone = done.has(g.id);
    // links de app sempre na mesma aba: é o que faz o celular abrir o aplicativo
    const newTab = state.newTab && !g.app;
    li.innerHTML = `
      <a class="game" href="${g.url}" ${newTab ? 'target="_blank" rel="noopener"' : ""}>
        <span class="emoji">${g.emoji}</span>
        <span class="info">
          <div class="name">${g.name}${g.app ? '<span class="tag">APP</span>' : ""}</div>
          <div class="desc">${g.desc || ""}</div>
        </span>
      </a>
      <button class="check" aria-label="${isDone ? "Desmarcar" : "Marcar"} ${g.name}">
        <span class="circle">${isDone ? "✔" : ""}</span>
        ${isDone ? '<span class="undo">desmarcar</span>' : ""}
      </button>`;
    // abrir o jogo já marca como jogado
    li.querySelector("a").addEventListener("click", () => setDone(g.id, true));
    li.querySelector("button").addEventListener("click", () => setDone(g.id, !isDone));
    list.appendChild(li);
  }

  const n = GAMES.filter(g => done.has(g.id)).length;
  document.getElementById("count").textContent = `${n}/${GAMES.length}`;
  document.getElementById("fill").style.width = `${(n / GAMES.length) * 100}%`;
  document.getElementById("allDone").classList.toggle("show", n === GAMES.length);

  const s = streak();
  document.getElementById("streak").innerHTML =
    s > 0 ? `🔥 Sequência: <b>${s} dia${s > 1 ? "s" : ""}</b> completando tudo` : "";

  document.getElementById("toggleTab").textContent =
    state.newTab ? "Abrir: em nova aba" : "Abrir: na mesma aba";
}

document.getElementById("date").textContent =
  new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

document.getElementById("toggleTab").addEventListener("click", () => {
  state.newTab = !state.newTab; save(); render();
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Desmarcar todos os jogos de hoje?")) {
    state.history[today()] = []; save(); render();
  }
});

// se virar o dia com a página aberta (ou ao voltar pra ela), atualiza
let lastDay = today();
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (today() !== lastDay) {
      lastDay = today();
      document.getElementById("date").textContent =
        new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    }
    render();
  }
});

render();
</script>
</body>
</html>
