<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jogos do Dia">
<title>Jogos do Dia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b22;
    --surface-2: #20242d;
    --text: #eef0f5;
    --muted: #8a90a0;
    --faint: #5b6070;
    --border: #262a34;
    --green: #5fbf6a;
    --green-soft: rgba(95, 191, 106, .14);
    --gold: #e0b84f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f4f7;
      --surface: #ffffff;
      --surface-2: #eef0f4;
      --text: #171a21;
      --muted: #676d7d;
      --faint: #a2a7b3;
      --border: #e3e5ea;
      --green: #3fa24c;
      --green-soft: rgba(63, 162, 76, .10);
      --gold: #b8871c;
      --shadow: 0 1px 2px rgba(20,24,33,.06), 0 6px 18px rgba(20,24,33,.06);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 560px;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--surface-2); }
  .ring .arc {
    stroke: var(--green); stroke-linecap: round;
    transition: stroke-dashoffset .5s cubic-bezier(.3,.7,.3,1);
  }
  .ring .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums;
  }
  .ring .num small { color: var(--muted); font-weight: 600; font-size: .75rem; }
  .head-text { min-width: 0; }
  h1 { font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .date { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .date::first-letter { text-transform: uppercase; }
  .streak {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 8px; padding: 3px 9px;
    border-radius: 99px; font-size: .78rem; font-weight: 600;
    background: rgba(224,184,79,.14); color: var(--gold);
  }
  .streak[hidden] { display: none; }

  /* ---------- Seções ---------- */
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 24px 4px 10px;
    font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .section-title[hidden] { display: none; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }

  /* ---------- Cartão ---------- */
  li {
    position: relative;
    display: flex; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .25s, border-color .25s, transform .15s;
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  li:active { transform: scale(.985); }
  li.done {
    background: var(--green-soft);
    border-color: transparent;
    box-shadow: none;
  }
  li.done::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--green);
  }

  a.game {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 8px 12px 14px;
    color: inherit; text-decoration: none;
  }
  .icon {
    position: relative;
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; overflow: hidden;
  }
  .icon img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; }
  li.done .icon { filter: grayscale(.7); opacity: .65; }
  .info { min-width: 0; }
  .name {
    font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 6px;
  }
  li.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .tag {
    font-size: .6rem; font-weight: 700; letter-spacing: .05em;
    color: var(--muted); background: var(--surface-2);
    border-radius: 5px; padding: 2px 5px; text-decoration: none;
  }
  .desc {
    color: var(--muted); font-size: .8rem; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .arrow { color: var(--faint); font-size: 1.1rem; margin-left: auto; padding-left: 4px; }

  /* ---------- Switch "Feito" ---------- */
  .toggle {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 14px 10px 10px;
    background: none; border: none; cursor: pointer; font: inherit;
  }
  .switch {
    position: relative;
    width: 52px; height: 30px;
    border-radius: 99px;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    transition: background .25s, border-color .25s;
  }
  .knob {
    position: absolute; top: 2px; left: 2px;
    width: 23px; height: 23px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform .25s cubic-bezier(.3,.7,.3,1.3);
  }
  .knob svg { width: 14px; height: 14px; stroke: var(--green); stroke-width: 3.2; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s .1s; }
  .toggle-label { font-size: .66rem; font-weight: 700; letter-spacing: .03em; color: var(--faint); text-transform: uppercase; }
  .toggle[aria-checked="true"] .switch { background: var(--green); border-color: var(--green); }
  .toggle[aria-checked="true"] .knob { transform: translateX(22px); }
  .toggle[aria-checked="true"] .knob svg { stroke-dashoffset: 0; }
  .toggle[aria-checked="true"] .toggle-label { color: var(--green); }

  /* ---------- Tudo feito ---------- */
  .all-done {
    display: none;
    margin-top: 18px; padding: 16px;
    text-align: center; border-radius: 16px;
    background: var(--green-soft); color: var(--green);
    font-weight: 700;
  }
  .all-done.show { display: block; animation: pop .35s ease; }

  footer { margin-top: 28px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  footer button {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    border-radius: 99px; padding: 9px 15px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="ring">
    <svg viewBox="0 0 80 80">
      <circle class="track" cx="40" cy="40" r="34"/>
      <circle class="arc" id="arc" cx="40" cy="40" r="34"/>
    </svg>
    <div class="num" id="count"></div>
  </div>
  <div class="head-text">
    <h1>Jogos do Dia</h1>
    <div class="date" id="date"></div>
    <div class="streak" id="streak" hidden></div>
  </div>
</header>

<div class="section-title" id="todoTitle"><span>A fazer</span><span id="todoCount"></span></div>
<ul id="todo"></ul>

<div class="all-done" id="allDone">🎉 Tudo feito por hoje!</div>

<div class="section-title" id="doneTitle"><span>Feitos</span><span id="doneCount"></span></div>
<ul id="done"></ul>

<footer>
  <button id="toggleTab"></button>
  <button id="reset">Desmarcar tudo</button>
</footer>

<script>
/* ============================================================
   LISTA DE JOGOS — para adicionar um jogo, copie uma linha.
   id:    identificador único (não mude depois, é usado no progresso)
   emoji: usado enquanto o ícone carrega ou se o site não tiver ícone
   icon:  (opcional) URL de um ícone específico, ignora a busca automática
   app:   (opcional) true = link que abre o app do celular
   ============================================================ */
const GAMES = [
  { id: "termo",      name: "Termo",      emoji: "🟩", desc: "Wordle em português",           url: "https://term.ooo/" },
  { id: "spotle",     name: "Spotle",     emoji: "🎵", desc: "Adivinhe o artista",            url: "https://spotle.io/" },
  { id: "betweenle",  name: "Betweenle",  emoji: "↕️", desc: "A palavra está entre…",         url: "https://betweenle.com/" },
  { id: "sanduba",    name: "Sanduba",    emoji: "🥪", desc: "Betweenle em português",        url: "https://a-hanauer.github.io/sanduba-jogo/" },
  { id: "word500",    name: "Word500",    emoji: "🔢", desc: "Dedução por contagem",          url: "https://word500.com/" },
  { id: "quinhentos", name: "Quinhentos", emoji: "5️⃣", desc: "Word500 em português",          url: "https://a-hanauer.github.io/500/" },
  { id: "foximax",    name: "Foximax",    emoji: "🦊", desc: "foximax.com",                   url: "https://foximax.com/" },
  { id: "linkedin",   name: "LinkedIn",   emoji: "💼", desc: "Queens, Tango, Zip, Pinpoint…", url: "https://www.linkedin.com/games/", app: true },
];

/* ============================================================ */

/* ---------- Ícones ----------
   Tenta, em ordem: ícone definido → favicon do próprio caminho do site
   → serviço de favicons do Google. Se nada servir, fica o emoji. */
function iconCandidates(g) {
  if (g.icon) return [g.icon];
  const u = new URL(g.url);
  const base = u.origin + u.pathname.replace(/[^/]*$/, "");
  const list = [];
  // sites em github.io compartilham domínio: procura o ícone dentro da pasta do jogo
  if (u.hostname.endsWith("github.io")) {
    list.push(base + "favicon.svg", base + "favicon.png", base + "favicon.ico", base + "apple-touch-icon.png");
  } else {
    list.push(`https://www.google.com/s2/favicons?domain=${u.hostname}&sz=128`);
    list.push(u.origin + "/apple-touch-icon.png", u.origin + "/favicon.ico");
  }
  return list;
}

function loadIcon(g, box) {
  const tries = iconCandidates(g);
  const next = () => {
    const src = tries.shift();
    if (!src) return;                         // desiste: mantém o emoji
    const img = new Image();
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.onload = () => {
      // o serviço do Google devolve um globo genérico de 16px quando não acha o ícone
      if (src.includes("google.com/s2") && img.naturalWidth <= 16) return next();
      box.textContent = "";
      box.appendChild(img);
    };
    img.onerror = next;
    img.src = src;
  };
  next();
}

/* ---------- Estado ---------- */
const KEY = "jogosDoDia.v1";
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => dayKey(new Date());

function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { s = {}; }
  s.history ??= {};
  s.newTab ??= false;
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

const state = load();
Object.keys(state.history).sort().slice(0, -60).forEach(d => delete state.history[d]);

const doneToday = () => new Set(state.history[today()] || []);
function setDone(id, value) {
  const set = doneToday();
  value ? set.add(id) : set.delete(id);
  state.history[today()] = [...set];
  save();
  render();
}

function streak() {
  const full = k => GAMES.every(g => (state.history[k] || []).includes(g.id));
  const d = new Date();
  if (!full(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (full(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- Cartões (criados uma vez, só mudam de lista) ---------- */
const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const cards = {};

function buildCard(g) {
  const li = document.createElement("li");
  li.innerHTML = `
    <a class="game" href="${g.url}">
      <span class="icon">${g.emoji}</span>
      <span class="info">
        <div class="name">${g.name}${g.app ? '<span class="tag">APP</span>' : ""}</div>
        <div class="desc">${g.desc || ""}</div>
      </span>
    </a>
    <button class="toggle" role="switch" aria-checked="false" aria-label="${g.name} feito">
      <span class="switch"><span class="knob">${CHECK_SVG}</span></span>
      <span class="toggle-label">A fazer</span>
    </button>`;
  loadIcon(g, li.querySelector(".icon"));
  li.querySelector("a").addEventListener("click", () => setDone(g.id, true));
  li.querySelector(".toggle").addEventListener("click", e => {
    const on = e.currentTarget.getAttribute("aria-checked") === "true";
    setDone(g.id, !on);
  });
  return li;
}
GAMES.forEach(g => cards[g.id] = buildCard(g));

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 34;
$("arc").style.strokeDasharray = CIRC;

function render() {
  const done = doneToday();
  const todoList = $("todo"), doneList = $("done");

  for (const g of GAMES) {
    const li = cards[g.id];
    const isDone = done.has(g.id);
    const target = isDone ? doneList : todoList;
    if (li.parentNode !== target) target.appendChild(li);
    li.classList.toggle("done", isDone);

    const t = li.querySelector(".toggle");
    t.setAttribute("aria-checked", isDone);
    t.querySelector(".toggle-label").textContent = isDone ? "Feito" : "A fazer";

    const a = li.querySelector("a");
    if (state.newTab && !g.app) { a.target = "_blank"; a.rel = "noopener"; }
    else { a.removeAttribute("target"); a.removeAttribute("rel"); }
  }
  // mantém a ordem da lista original dentro de cada seção
  for (const list of [todoList, doneList]) {
    GAMES.forEach(g => { if (cards[g.id].parentNode === list) list.appendChild(cards[g.id]); });
  }

  const n = GAMES.filter(g => done.has(g.id)).length, total = GAMES.length;
  $("count").innerHTML = `${n}<small>/${total}</small>`;
  $("arc").style.strokeDashoffset = CIRC * (1 - n / total);

  $("todoTitle").hidden = n === total;
  $("doneTitle").hidden = n === 0;
  $("todoCount").textContent = total - n;
  $("doneCount").textContent = n;
  $("allDone").classList.toggle("show", n === total);

  const s = streak();
  $("streak").hidden = s === 0;
  $("streak").textContent = `🔥 ${s} dia${s > 1 ? "s" : ""} seguido${s > 1 ? "s" : ""} completo${s > 1 ? "s" : ""}`;

  $("toggleTab").textContent = state.newTab ? "↗ Abrindo em nova aba" : "↩ Abrindo na mesma aba";
}

function renderDate() {
  $("date").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
}

$("toggleTab").addEventListener("click", () => { state.newTab = !state.newTab; save(); render(); });
$("reset").addEventListener("click", () => {
  if (confirm("Desmarcar todos os jogos de hoje?")) { state.history[today()] = []; save(); render(); }
});

// ao voltar para o painel (ou se virar o dia), atualiza
document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderDate(); render(); } });
window.addEventListener("pageshow", () => { renderDate(); render(); });

renderDate();
render();
</script>
</body>
</html>
